<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Cardápio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #dc3545; margin-bottom: 25px; }
        .section { background: #fdfdfd; padding: 15px; border: 1px solid #e9ecef; border-radius: 8px; margin-bottom: 20px; }
        .section h2 { margin-top: 0; color: #495057; font-size: 1.1rem; border-bottom: 2px solid #dc3545; padding-bottom: 5px; }
        label { display: block; margin-top: 10px; font-weight: 600; font-size: 0.9rem; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
        button.btn-salvar { width: 100%; background: #28a745; color: white; border: none; padding: 14px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; margin-top: 10px; }
        button.btn-salvar:hover { background: #218838; }
        .status-msg { padding: 12px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: bold; display: none; }
        .status-sucesso { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-erro { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Painel de Controle do Cardápio</h1>
        <div id="status-msg" class="status-msg"></div>

        <form id="admin-form" onsubmit="salvarCardapio(event)">
            <div class="section">
                <h2>🍲 Pratos Principais</h2>
                <label>Pratos do dia (um por linha):</label>
                <textarea id="pratos" rows="4" placeholder="Ex: Feijoada Completa&#10;Strogonoff de Frango">{{ cardapio.pratos | join('\n') if cardapio.pratos else '' }}</textarea>
            </div>

            <div class="section">
                <h2>💵 Tamanhos e Preços das Marmitas</h2>
                <div style="display: flex; gap: 15px;">
                    <div style="flex: 1;">
                        <label>Marmita M (R$):</label>
                        <input type="number" step="0.01" id="preco_m" value="{{ cardapio.marmitas.M if cardapio.marmitas else 0 }}">
                    </div>
                    <div style="flex: 1;">
                        <label>Marmita G (R$):</label>
                        <input type="number" step="0.01" id="preco_g" value="{{ cardapio.marmitas.G if cardapio.marmitas else 0 }}">
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>🥩 Carnes e Acompanhamentos</h2>
                <label>Opções de Carnes (uma por linha):</label>
                <textarea id="carnes" rows="3">{{ cardapio.carnes | join('\n') if cardapio.carnes else '' }}</textarea>

                <label>Opções de Guarnições (uma por linha):</label>
                <textarea id="guarnicoes" rows="3">{{ cardapio.guarnicoes | join('\n') if cardapio.guarnicoes else '' }}</textarea>
            </div>

            <div class="section">
                <h2>🛵 Bairros para Entrega</h2>
                <label>Bairros e Taxas (Formato: Nome do Bairro - Valor):</label>
                <textarea id="bairros" rows="3" placeholder="Ex: Centro - 5.00&#10;Nossa Senhora Aparecida - 7.00">{{ cardapio.bairros | join('\n') if cardapio.bairros else '' }}</textarea>
            </div>

            <div class="section">
                <h2>📱 Pagamento e WhatsApp</h2>
                <label>Chave PIX:</label>
                <input type="text" id="pix_chave" value="{{ cardapio.pix.chave if cardapio.pix else '' }}">

                <label>Nome do Titular do PIX:</label>
                <input type="text" id="pix_titular" value="{{ cardapio.pix.titular if cardapio.pix else '' }}">

                <label>WhatsApp para Receber Pedidos (com DDD, só números):</label>
                <input type="text" id="whatsapp" value="{{ cardapio.whatsapp if cardapio.whatsapp else '' }}">
            </div>

            <button type="submit" class="btn-salvar">💾 Salvar Alterações no Cardápio</button>
        </form>
    </div>

    <script>
        async function salvarCardapio(event) {
            // IMPEDE O RECARREGAMENTO DA PÁGINA ANTES DE SALVAR!
            event.preventDefault();

            const status = document.getElementById('status-msg');
            status.style.display = 'block';
            status.className = 'status-msg';
            status.style.backgroundColor = '#e2e3e5';
            status.style.color = '#383d41';
            status.innerText = '⏳ Salvando no banco de dados Supabase...';

            const pratosTexto = document.getElementById('pratos').value;
            const carnesTexto = document.getElementById('carnes').value;
            const guarnicoesTexto = document.getElementById('guarnicoes').value;
            const bairrosTexto = document.getElementById('bairros').value;

            const payload = {
                pratos: pratosTexto.split('\n').map(s => s.trim()).filter(Boolean),
                marmitas: {
                    M: parseFloat(document.getElementById('preco_m').value) || 0,
                    G: parseFloat(document.getElementById('preco_g').value) || 0
                },
                carnes: carnesTexto.split('\n').map(s => s.trim()).filter(Boolean),
                guarnicoes: guarnicoesTexto.split('\n').map(s => s.trim()).filter(Boolean),
                bairros: bairrosTexto.split('\n').map(s => s.trim()).filter(Boolean),
                pix: {
                    chave: document.getElementById('pix_chave').value,
                    titular: document.getElementById('pix_titular').value
                },
                whatsapp: document.getElementById('whatsapp').value,
                especiais: { ativo: false, itens: [] },
                casa: { ativo: false, itens: [] }
            };

            try {
                const response = await fetch('/api/salvar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const res = await response.json();
                if (response.ok) {
                    status.className = 'status-msg status-sucesso';
                    status.innerText = '✅ Cardápio salvo com sucesso no Supabase!';
                } else {
                    status.className = 'status-msg status-erro';
                    status.innerText = '❌ Erro ao salvar: ' + (res.mensagem || 'Falha ao gravar no banco.');
                }
            } catch (err) {
                status.className = 'status-msg status-erro';
                status.innerText = '❌ Erro de conexão com o servidor.';
            }
        }
    </script>
</body>
</html>
