<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Marmitas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
        button:hover { background: #218838; }
        .mensagem { margin-top: 15px; padding: 10px; border-radius: 5px; display: none; }
        .sucesso { background: #d4edda; color: #155724; }
        .erro { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Painel de Controle do Cardápio</h1>
        <div id="msg" class="mensagem"></div>

        <form id="form-cardapio">
            <h2>Pratos do Dia</h2>
            <label>Pratos (um por linha):</label>
            <textarea id="pratos" rows="4">{{ cardapio.pratos | join('\n') if cardapio.pratos else '' }}</textarea>

            <h2>Preços das Marmitas</h2>
            <label>Marmita M (R$):</label>
            <input type="number" step="0.01" id="preco_m" value="{{ cardapio.marmitas.M if cardapio.marmitas else 0 }}">

            <label>Marmita G (R$):</label>
            <input type="number" step="0.01" id="preco_g" value="{{ cardapio.marmitas.G if cardapio.marmitas else 0 }}">

            <h2>Acompanhamentos</h2>
            <label>Carnes (uma por linha):</label>
            <textarea id="carnes" rows="3">{{ cardapio.carnes | join('\n') if cardapio.carnes else '' }}</textarea>

            <label>Guarnições (uma por linha):</label>
            <textarea id="guarnicoes" rows="3">{{ cardapio.guarnicoes | join('\n') if cardapio.guarnicoes else '' }}</textarea>

            <h2>Dados de Pagamento e Contato</h2>
            <label>Chave PIX:</label>
            <input type="text" id="pix_chave" value="{{ cardapio.pix.chave if cardapio.pix else '' }}">

            <label>Titular do PIX:</label>
            <input type="text" id="pix_titular" value="{{ cardapio.pix.titular if cardapio.pix else '' }}">

            <label>WhatsApp (somente números):</label>
            <input type="text" id="whatsapp" value="{{ cardapio.whatsapp if cardapio.whatsapp else '' }}">

            <button type="button" onclick="salvarCardapio()">Salvar Cardápio no Banco</button>
        </form>
    </div>

    <script>
        async function salvarCardapio() {
            const msgDiv = document.getElementById('msg');
            msgDiv.style.display = 'block';
            msgDiv.className = 'mensagem';
            msgDiv.innerText = 'Salvando no banco de dados, aguarde...';

            const pratosTexto = document.getElementById('pratos').value;
            const carnesTexto = document.getElementById('carnes').value;
            const guarnicoesTexto = document.getElementById('guarnicoes').value;

            const dados = {
                pratos: pratosTexto.split('\n').map(s => s.trim()).filter(Boolean),
                marmitas: {
                    M: parseFloat(document.getElementById('preco_m').value) || 0,
                    G: parseFloat(document.getElementById('preco_g').value) || 0
                },
                carnes: carnesTexto.split('\n').map(s => s.trim()).filter(Boolean),
                guarnicoes: guarnicoesTexto.split('\n').map(s => s.trim()).filter(Boolean),
                bairros: [],
                pix: {
                    chave: document.getElementById('pix_chave').value,
                    titular: document.getElementById('pix_titular').value
                },
                whatsapp: document.getElementById('whatsapp').value,
                especiais: { ativo: false, itens: [] },
                casa: { ativo: false, itens: [] }
            };

            try {
                const response = await fetch('/api/salvar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const res = await response.json();
                if (response.ok) {
                    msgDiv.className = 'mensagem sucesso';
                    msgDiv.innerText = '✅ Cardápio salvo com sucesso no Supabase!';
                } else {
                    msgDiv.className = 'mensagem erro';
                    msgDiv.innerText = '❌ Erro ao salvar: ' + (res.mensagem || 'Erro desconhecido');
                }
            } catch (err) {
                msgDiv.className = 'mensagem erro';
                msgDiv.innerText = '❌ Erro na comunicação com o servidor.';
            }
        }
    </script>
</body>
</html>
