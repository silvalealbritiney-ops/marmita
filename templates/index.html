<!-- 1. ESCOLHA O TAMANHO -->
        <div class="section">
            <h4>1. Escolha o Tamanho</h4>
            <label><input type="radio" name="tamanho" value="Marmita M" data-preco="{{ cardapio.tamanho_m }}" onclick="atualizarTotal()" checked> 📦 Tamanho M - R$ {{ cardapio.tamanho_m }}</label>
            <label><input type="radio" name="tamanho" value="Marmita G" data-preco="{{ cardapio.tamanho_g }}" onclick="atualizarTotal()"> 📦 Tamanho G - R$ {{ cardapio.tamanho_g }}</label>
        </div>

        <!-- 2. ESCOLHA A CARNE -->
        <div class="section">
            <h4>2. Escolha a Carne</h4>
            {% for carne in cardapio.carnes %}
            <label><input type="radio" name="carne" value="{{ carne }}" {% if loop.first %}checked{% endif %}> 🥩 {{ carne }}</label>
            {% endfor %}
        </div>
